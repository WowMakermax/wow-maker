<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B8F6B">
<title>Wow Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F7FB;--card:#fff;--ink:#14213D;--muted:#5B6B82;--green:#0B8F6B;--green-d:#08705A;--gold:#FFB703;--err:#B3261E;--line:#D7E0EA}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Rubik,system-ui,sans-serif;min-height:100vh}
html[lang=ur] body{font-family:"Noto Nastaliq Urdu",Rubik,system-ui,sans-serif;line-height:2.1}
.wrap{max-width:440px;margin:0 auto;padding:20px 18px 40px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;direction:ltr;font-family:Rubik,sans-serif;line-height:1.2}
.sticker{background:var(--gold);color:var(--ink);padding:6px 12px;border-radius:12px;transform:rotate(-5deg);box-shadow:3px 3px 0 var(--ink);font-size:24px}
.lang{min-height:44px;padding:0 16px;border:2px solid var(--ink);border-radius:22px;background:transparent;color:var(--ink);font:inherit;font-size:15px;cursor:pointer}
h1{font-size:26px;line-height:1.5;margin:0 0 6px}
html[lang=ur] h1{line-height:2}
.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:5px;border-radius:12px;margin-bottom:18px}
.tab{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font:inherit;font-weight:500;cursor:pointer}
.tab[aria-selected=true]{background:var(--ink);color:#fff}
label{display:block;font-weight:500;margin:12px 0 4px}
input{width:100%;min-height:48px;padding:0 14px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
input[type=email],input[type=password]{direction:ltr;text-align:start}
html[dir=rtl] input[type=email],html[dir=rtl] input[type=password]{text-align:right}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.go{width:100%;min-height:50px;margin-top:20px;border:0;border-radius:12px;background:var(--green);color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer}
.go:hover{background:var(--green-d)}
.go:disabled{opacity:.6;cursor:wait}
.msg{margin:14px 0 0;color:var(--err);font-weight:500;min-height:1.5em}
.out{margin-top:18px;min-height:46px;padding:0 18px;border:2px solid var(--ink);border-radius:12px;background:transparent;color:var(--ink);font:inherit;font-weight:500;cursor:pointer}
.hi{font-size:24px;font-weight:700;margin:0 0 4px;word-break:break-word}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="brand"><span class="sticker">Wow!</span><span>Maker</span></div>
    <button class="lang" id="lang" type="button">English</button>
  </header>

  <section id="auth" hidden>
    <h1 data-i="tagline"></h1>
    <p class="sub" data-i="sub"></p>
    <div class="card">
      <div class="tabs" role="tablist">
        <button class="tab" id="tab-signup" role="tab" type="button" data-i="signup"></button>
        <button class="tab" id="tab-login" role="tab" type="button" data-i="login"></button>
      </div>
      <form id="form" novalidate>
        <div id="nameRow"><label for="name" data-i="name"></label><input id="name" type="text" autocomplete="name"></div>
        <label for="email" data-i="email"></label>
        <input id="email" type="email" autocomplete="email" inputmode="email">
        <label for="password" data-i="password"></label>
        <input id="password" type="password" autocomplete="current-password">
        <button class="go" id="go" type="submit"></button>
        <p class="msg" id="msg" role="alert"></p>
      </form>
    </div>
  </section>

  <section id="home" hidden>
    <div class="card">
      <p class="hi"><span data-i="welcome"></span> <span id="who"></span></p>
      <p class="sub" data-i="soon"></p>
      <button class="out" id="logout" type="button" data-i="logout"></button>
    </div>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB7iISoCwT7H2HHFG130F1-SEW4z4DQPPE",
  authDomain: "wow-maker-6599c.firebaseapp.com",
  projectId: "wow-maker-6599c",
  storageBucket: "wow-maker-6599c.firebasestorage.app",
  messagingSenderId: "249401398630",
  appId: "1:249401398630:web:c20b1e9399761c3702e4a7"
};

const app = initializeApp(firebaseConfig);
  
const auth = getAuth(app);
const db = getFirestore(app);

const T = {
  ur: {
    tagline: "اپنا ہنر پوری دنیا کو دکھائیں",
    sub: "ویڈیو بنائیں، شیئر کریں اور فالوورز بڑھائیں۔",
    signup: "نیا اکاؤنٹ", login: "لاگ اِن",
    name: "آپ کا نام", email: "ای میل", password: "پاس ورڈ (کم از کم 6 حروف)",
    goSignup: "اکاؤنٹ بنائیں", goLogin: "لاگ اِن کریں", logout: "لاگ آؤٹ",
    welcome: "خوش آمدید،", soon: "ویڈیو اپ لوڈ اور فیڈ جلد آ رہے ہیں۔",
    other: "English",
    e: {
      name: "اپنا نام لکھیں۔",
      "auth/invalid-email": "ای میل درست نہیں ہے۔",
      "auth/email-already-in-use": "اس ای میل سے اکاؤنٹ پہلے سے موجود ہے۔ لاگ اِن کریں۔",
      "auth/weak-password": "پاس ورڈ کم از کم 6 حروف کا رکھیں۔",
      "auth/missing-password": "پاس ورڈ لکھیں۔",
      "auth/invalid-credential": "ای میل یا پاس ورڈ غلط ہے۔",
      "auth/network-request-failed": "انٹرنیٹ چیک کریں اور دوبارہ کوشش کریں۔",
      "auth/too-many-requests": "بہت زیادہ کوششیں۔ کچھ دیر بعد دوبارہ کوشش کریں۔",
      other: "کچھ گڑبڑ ہو گئی۔ دوبارہ کوشش کریں۔"
    }
  },
  en: {
    tagline: "Show your talent to the whole world",
    sub: "Make videos, share them and grow your followers.",
    signup: "Sign up", login: "Log in",
    name: "Your name", email: "Email", password: "Password (at least 6 characters)",
    goSignup: "Create account", goLogin: "Log in", logout: "Log out",
    welcome: "Welcome,", soon: "Video upload and the feed are coming soon.",
    other: "اردو",
    e: {
      name: "Enter your name.",
      "auth/invalid-email": "That email address is not valid.",
      "auth/email-already-in-use": "An account with this email already exists. Log in instead.",
      "auth/weak-password": "Use a password with at least 6 characters.",
      "auth/missing-password": "Enter your password.",
      "auth/invalid-credential": "Email or password is wrong.",
      "auth/network-request-failed": "Check your internet and try again.",
      "auth/too-many-requests": "Too many attempts. Try again in a little while.",
      other: "Something went wrong. Please try again."
    }
  }
};

const $ = id => document.getElementById(id);
let lang = "en", mode = "signup", user = null, lastErr = null;
try { lang = localStorage.getItem("wm-lang") || ((navigator.language || "").startsWith("ur") ? "ur" : "en"); } catch (e) {}

function render() {
  const s = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ur" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = s[el.dataset.i]);
  $("lang").textContent = s.other;
  $("go").textContent = mode === "signup" ? s.goSignup : s.goLogin;
  $("nameRow").hidden = mode !== "signup";
  $("password").autocomplete = mode === "signup" ? "new-password" : "current-password";
  $("tab-signup").setAttribute("aria-selected", mode === "signup");
  $("tab-login").setAttribute("aria-selected", mode === "login");
  $("msg").textContent = lastErr ? (s.e[lastErr] || s.e.other) : "";
  $("auth").hidden = !!user;
  $("home").hidden = !user;
  if (user) $("who").textContent = user.displayName || user.email;
}

$("lang").onclick = () => {
  lang = lang === "ur" ? "en" : "ur";
  try { localStorage.setItem("wm-lang", lang); } catch (e) {}
  render();
};
$("tab-signup").onclick = () => { mode = "signup"; lastErr = null; render(); };
$("tab-login").onclick = () => { mode = "login"; lastErr = null; render(); };
$("logout").onclick = () => signOut(auth);

$("form").onsubmit = async ev => {
  ev.preventDefault();
  lastErr = null;
  const name = $("name").value.trim(), email = $("email").value.trim(), pw = $("password").value;
  $("go").disabled = true;
  try {
    if (mode === "signup") {
      if (!name) throw { code: "name" };
      const cred = await createUserWithEmailAndPassword(auth, email, pw);
      await updateProfile(cred.user, { displayName: name });
      try {
        await setDoc(doc(db, "users", cred.user.uid), { name, followers: 0, monetized: false, createdAt: serverTimestamp() });
      } catch (e) { console.warn("Profile save skipped:", e.code); }
      user = auth.currentUser;
    } else {
      await signInWithEmailAndPassword(auth, email, pw);
    }
  } catch (err) {
    lastErr = err.code || "other";
  }
  $("go").disabled = false;
  render();
};

onAuthStateChanged(auth, u => { user = u; render(); });
render();
</script>
</body>
</html>
